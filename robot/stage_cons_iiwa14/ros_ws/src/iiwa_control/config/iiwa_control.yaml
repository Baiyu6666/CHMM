joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 200

SafeTorqueController:
  type: iiwa_control/WatchdogEffortController
  command_timeout: 0.05
  max_abs_command: 6.0
  position_stop_margin: 0.0872664626  # 5 degrees, measured from each URDF limit
  joints:
    - $(arg robot_name)_joint_1
    - $(arg robot_name)_joint_2
    - $(arg robot_name)_joint_3
    - $(arg robot_name)_joint_4
    - $(arg robot_name)_joint_5
    - $(arg robot_name)_joint_6
    - $(arg robot_name)_joint_7

PositionTrajectoryController:
  type: position_controllers/JointTrajectoryController
  joints:
    - $(arg robot_name)_joint_1
    - $(arg robot_name)_joint_2
    - $(arg robot_name)_joint_3
    - $(arg robot_name)_joint_4
    - $(arg robot_name)_joint_5
    - $(arg robot_name)_joint_6
    - $(arg robot_name)_joint_7
  constraints:
    goal_time: 1.0
    stopped_velocity_tolerance: 0.02
  state_publish_rate: 50
  action_monitor_rate: 20
  stop_trajectory_duration: 0.5
